{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card p-4 p-md-5">
    <div class="text-center mb-4"><div class="auth-icon"><i class="fa-solid fa-shield-halved"></i></div><h2 class="fw-bold mt-3">Welcome back</h2><p class="text-muted mb-0">Sign in to EduPredict</p></div>
    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3"><label class="form-label fw-semibold">Login as</label><select class="form-select form-select-lg" name="role" required><option value="" disabled selected>Select account type</option><option value="student">Student</option><option value="teacher">Teacher</option></select></div>
      <div class="mb-3"><label class="form-label fw-semibold">Email address</label><input class="form-control form-control-lg" type="email" name="email" autocomplete="username" required placeholder="name@example.com"></div>
      <div class="mb-4"><label class="form-label fw-semibold">Password</label><input class="form-control form-control-lg" type="password" name="password" autocomplete="current-password" required placeholder="Enter your password"></div>
      <button class="btn btn-brand btn-lg w-100" type="submit">Login <i class="fa-solid fa-arrow-right ms-2"></i></button>
    </form>
    <p class="text-center text-muted mt-4 mb-0">Student account not created? <a href="{{ url_for('student_register') }}">Register here</a></p>
    <p class="tiny text-muted text-center mt-3 mb-0">Teacher accounts are created by the system administrator.</p>
  </div>
</div>
{% endblock %}
